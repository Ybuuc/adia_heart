<head>

<title>Адия, это для тебя ♡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E💗%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--rose:#f8b7c9;--muted:#b59caa}
*{box-sizing:border-box}body{margin:0;background:#160d16;color:#fff0f4;font-family:Arial,Helvetica,sans-serif;min-width:280px;min-height:100svh;background-image:radial-gradient(ellipse at 50% 42%,#381326 0,transparent 61%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(circle at 13% 20%,#ffd5e0 0 1px,transparent 2px),radial-gradient(circle at 85% 32%,#ffd5e0 0 1px,transparent 2px),radial-gradient(circle at 18% 76%,#ffd5e0 0 1px,transparent 2px),radial-gradient(circle at 78% 83%,#ffd5e0 0 1px,transparent 2px)}
main{width:min(100%,860px);margin:auto;text-align:center;padding:42px 20px 28px;position:relative}
.eyebrow{margin:0 0 15px;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:4px;text-transform:uppercase}
h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(54px,8vw,84px);font-weight:400;line-height:1.04;margin:0;letter-spacing:-3px}
h1 span{color:var(--rose);font-style:italic}.intro{font-size:14px;line-height:1.6;color:#ccb3c0;margin:15px 0 0}
.heart-stage{margin:-20px auto -30px;max-width:640px;position:relative}
.heart-stage::before{content:'';position:absolute;inset:26% 20%;background:#e64579;filter:blur(85px);opacity:.12;pointer-events:none}
svg{display:block;width:100%;height:auto;overflow:visible;isolation:isolate}
.heart{transform-origin:320px 300px;animation:heartbeat 3.6s ease-in-out 2.6s infinite}
.word{font:17px Arial,Helvetica,sans-serif;text-anchor:middle;fill:#ef8cad;opacity:.94;animation:gather 2s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}
.word:nth-child(3n){fill:#ffd3df}.word:nth-child(3n+1){fill:#dc668e}
.message{min-height:58px;display:grid;place-items:center;margin:0 auto 22px;max-width:530px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(20px,3vw,26px);line-height:1.45;color:#fce4eb}
.message.changed{animation:message-in .5s ease both}.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-size:13px;cursor:pointer;border-radius:100px;min-height:48px;padding:0 23px;transition:background .2s,transform .2s;border:1px solid #714356;background:transparent;color:#e5bfcd;-webkit-tap-highlight-color:transparent}
button.primary{background:#f4bfd0;border-color:#f4bfd0;color:#391b2b}button:hover{background:#442436}button.primary:hover{background:#ffdae6}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #fff;outline-offset:5px}
footer{margin-top:36px;font-size:10px;letter-spacing:2px;color:#af8d9e}footer span{color:#e78bad;margin:0 7px}
@keyframes gather{from{opacity:0;transform:translate(var(--dx),var(--dy));filter:blur(5px)}to{opacity:.94;transform:translate(0,0);filter:blur(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.027)}45%{transform:scale(1)}60%{transform:scale(1.015)}}
@keyframes message-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){main{padding:36px 14px 24px}.eyebrow{font-size:9px;letter-spacing:3px}.intro{font-size:13px}.heart-stage{margin:0 -7px -4px}.message{min-height:76px;padding:0 10px;margin-bottom:18px}.actions{gap:9px}button{padding:0 17px;font-size:12px}footer{margin-top:30px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

</svg>
</div>
<p class="message" id="message" aria-live="polite" aria-atomic="true">Адия, с тобой мир становится теплее.</p>
<div class="actions"><button class="primary" id="compliment" type="button">Ещё тёплое слово ♡</button><button id="replay" type="button" aria-label="Повторить анимацию сердца">Повторить магию ↻</button></div>

<script>
'use strict';
const compliments = [
 'Адия, с тобой мир становится теплее.',
 'Твоя улыбка — мой любимый повод улыбнуться.',
 'Адия, в тебе столько света.',
 'Ты делаешь обычные моменты особенными.',
 'Твоя нежность — маленькое чудо.',
 'Адия, ты прекрасна, когда просто остаёшься собой.',
 'С тобой даже тишина уютная.',
 'Ты — самое красивое «как прошёл день?».',
 'Адия, твоя доброта согревает.',
 'Ты заслуживаешь самых тёплых слов.',
 'С тобой хочется замечать прекрасное.',
 'Адия, ты — чья-то самая тёплая мысль.'
];
let current = 0;
const message = document.getElementById('message');
document.getElementById('compliment').addEventListener('click', () => {
 current = (current + 1) % compliments.length;
 message.textContent = compliments[current];
 message.classList.remove('changed');
 void message.offsetWidth;
 message.classList.add('changed');
});
document.getElementById('replay').addEventListener('click', () => {
 const heart = document.querySelector('.heart');
 heart.replaceWith(heart.cloneNode(true));
});
</script>
